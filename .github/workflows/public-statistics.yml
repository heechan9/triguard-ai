name: Public statistics data quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_public_statistics.py' -v
      - run: python -m unittest discover -s tests -p 'test_public_release_guard.py' -v
      - run: python scripts/build_public_statistics.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/test_data_review.cjs tests/test_statistics_tools.cjs tests/test_dashboard_state.cjs tests/test_csv_review.cjs tests/test_report_evidence.cjs tests/test_validation_trace.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: public-statistics-validation
          path: |
            dist/data/validation_report.json
            dist/data/release_manifest.json
